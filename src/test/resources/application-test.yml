oracle:
  enabled: false

spring:
  datasource:
    jdbc-url: jdbc:postgresql://localhost:5432/ttok_ttok_test
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  # 테이블을 만들기 전에 pgvector 확장을 켠다 (lab_search_document의 vector 컬럼에 필요)
  # DB 이미지에 pgvector가 설치만 되어 있고, DB마다 CREATE EXTENSION을 한 번 해야 쓸 수 있다
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/pgvector-extension.sql

jwt:
  secret: "test-jwt-secret-key-must-be-long-enough-for-hs256-tests"
  access-token-expiration-millis: 3600000
  refresh-token-expiration-millis: 1209600000

# 실제 외부 호출은 하지 않고, 컨텍스트 로딩용 더미 값
ai:
  base-url: http://localhost
  api-key: test-ai-api-key
  research-lab-chatbot-id: "0"
  email-editor-chatbot-id: "0"

ntis:
  base-url: http://localhost
  api-key: test-ntis-api-key

openalex:
  base-url: http://localhost
