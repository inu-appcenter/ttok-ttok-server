plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.inuappcenter'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
    implementation 'org.springframework.boot:spring-boot-starter-security' // 인증/인가, SecurityConfig, JWT 필터를 붙이기 위해 필요
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6' // JWT 생성/검증 API
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6' // jjwt 실제 구현체
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6' // JWT claims를 JSON으로 처리할 때 필요
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3' // 스웨거 의존성
    implementation 'org.apache.poi:poi-ooxml:5.4.1' // 엑셀 파싱을 위한 의존성
    implementation 'org.springframework.boot:spring-boot-starter-webflux' // 웹 클라이언트 의존성(AI API 호출에 사용)
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml' // NTIS 국가R&D 과제검색 API가 XML로 응답해서 필요
    implementation 'org.hibernate.orm:hibernate-vector' // 연구실 추천 검색: pgvector의 vector 타입을 float[]로 매핑
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        // 실패 원인 메시지가 콘솔(CI 로그 포함)에 바로 보이도록
        exceptionFormat = "full"
        events "failed"
    }
}